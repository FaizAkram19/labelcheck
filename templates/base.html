{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B3A5C">
<title>{% block title %}Label compliance check{% endblock %}</title>
<link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>

<div class="appbar">
  <div class="appbar__inner">
    <a class="brand" href="/">
      <svg class="brand__mark" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 4.5v15M7.5 19.5h9M4 8h16"/>
        <path d="M1.5 13h5L4 8z"/><path d="M17.5 13h5L20 8z"/>
      </svg>
      <span class="brand__name">Label check</span>
    </a>
    {% block nav %}{% endblock %}
  </div>
</div>

<main class="wrap">
{% block content %}{% endblock %}
</main>

{% block scripts %}{% endblock %}
</body>
</html>
